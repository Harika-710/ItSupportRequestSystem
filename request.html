<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Support Request</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f5f0fa;
            color: #333;
        }

        .container {
            max-width: 430px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 18px #d8c9e5;
        }

        h2 {
            text-align: center;
            color: #76518f;
            font-size: 23px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #d6c6e2;
            border-radius: 7px;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #9875b5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #76518f;
        }

        #message {
            text-align: center;
            color: green;
            font-size: 14px;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #76518f;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Submit a Support Request</h2>

    <form id="requestForm">
        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="category">Issue Category</label>
        <select id="category" required>
            <option value="">Select category</option>
            <option>Hardware</option>
            <option>Software</option>
            <option>Network / Wi-Fi</option>
            <option>Login Problem</option>
            <option>Printer Problem</option>
            <option>Email Problem</option>
            <option>Other</option>
        </select>

        <label for="priority">Priority</label>
        <select id="priority" required>
            <option value="">Select priority</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Urgent</option>
        </select>

        <label for="description">Problem Description</label>
        <textarea id="description"
                  placeholder="Explain your problem..."
                  required></textarea>

        <button type="submit">Submit Request</button>

        <p id="message"></p>
    </form>

    <a class="back" href="index.html">← Back to Home</a>
</div>

<script>
    document.getElementById("requestForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = document.getElementById("message");

            const requestData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                category: document.getElementById("category").value,
                priority: document.getElementById("priority").value,
                description: document.getElementById("description").value
            };

            try {
                const response = await fetch(
                    "http://localhost:3000/submit-request",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(requestData)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Submission failed");
                }

                message.textContent =
                    "Request submitted successfully! Request ID: " +
                    result.requestId;

                this.reset();

            } catch (error) {
                message.style.color = "red";
                message.textContent =
                    "Error: " + error.message;
            }
        });
</script>

</body>
</html>
